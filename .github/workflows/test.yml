name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install the bundle's own dependencies
        run: npm install --no-audit --no-fund
      - name: Syntax check
        run: |
          for file in index.js client.js src/*.js test/smoke.mjs; do node --check "$file"; done
      - name: Offline smoke test
        run: node test/smoke.mjs
